[pytest]
# `code/` is put on sys.path so lessons can `from common.llm import ...`
# and `from day05.state import ...` without installing anything.
pythonpath = code projects/capstone/src
testpaths = code projects/capstone/tests
addopts = -q --import-mode=importlib
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    infra: needs live Postgres/Redis (set DATABASE_URL / REDIS_URL); skipped otherwise
    live_llm: needs a real LLM endpoint (set LLM_API_KEY); skipped otherwise
